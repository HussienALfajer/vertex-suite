name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to the commit a tag named when it was chosen, with the tag beside
# it. A tag can be moved to other code by whoever controls the action's repository,
# and this workflow runs with the repository checked out — which is the same
# argument that pins every npm dependency exactly (.npmrc).

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VERTEX_TEST_POSTGRES_URL: postgresql://postgres:root@127.0.0.1:5432/postgres
    # A run takes three to eight minutes. A hung one would otherwise hold a runner
    # for GitHub's six-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is the certified store-node and register platform; Linux is the
        # cloud target. Both run from the first commit so neither can drift.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both runner images include PostgreSQL but leave it stopped. The storage
      # suite must exercise the real server on both operating systems.
      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'root'"
          pg_isready -h 127.0.0.1 -p 5432

      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432

      - run: pnpm verify

  journeys:
    name: journeys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VERTEX_TEST_POSTGRES_URL: postgresql://postgres:root@127.0.0.1:5432/postgres
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'root'"
          pg_isready -h 127.0.0.1 -p 5432

      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432

      # The library is consumed from source by the sandbox, but the workspace
      # still builds first so a type error surfaces here rather than as a
      # confusing browser failure.
      - run: pnpm build

      # Every app that has journeys, rather than a named one: an app added
      # without its browser is an app whose journeys are skipped in the one
      # place nobody is watching.
      #
      # One at a time, because `--with-deps` shells out to apt and two of those
      # at once fight over the dpkg lock — which fails the job with a code that
      # says nothing about browsers at all.
      - name: Install the browser the journeys run in
        run: pnpm --filter "./apps/*" --workspace-concurrency=1 run install:browsers

      # §13: keyboard-only, light and dark. A focus ring that is invisible in
      # one theme is a focus ring that does not exist for half the day.
      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/*/test-results/
          retention-days: 7
